<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フォームへ移動中...</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f9fa;
      color: #333;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e0e0e0;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 14px;
      font-weight: 500;
      color: #666;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>フォームへ移動しています...</p>

  <script>
    // =============================================================
    // 【設定箇所】ご自身の環境に合わせてここを書き換えてください
    // =============================================================
    const LIFF_ID = "2012256974-hKUu8py6"; // 例: 2001234567-Abcdefgh
    const FORM_BASE_URL = "https://docs.google.com/forms/d/e/1FAIpQLSd86VJfVMbUDqWHzsd8PSM3QT4XgPg2i3uOcTuYAWza5WGTYQ/viewform?usp=pp_url&entry.2000616042=";

    // =============================================================
    // LIFF初期化と自動リダイレクト処理
    // =============================================================
    async function redirectGoogleForm() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // 端末内キャッシュ（IDトークン）から即座にLINE User IDを取得（通信待ちを短縮）
        let userId = "";
        const idToken = liff.getDecodedIDToken();
        if (idToken && idToken.sub) {
          userId = idToken.sub;
        } else {
          // IDトークンから取得できなかった場合のフォールバック（サーバー通信）
          const profile = await liff.getProfile();
          userId = profile.userId;
        }

        if (userId) {
          // 履歴を残さずGoogleフォームへ遷移（ブラウザの「戻る」ボタンでのループを防止）
          window.location.replace(FORM_BASE_URL + encodeURIComponent(userId));
        } else {
          throw new Error("ユーザーIDを取得できませんでした。");
        }
      } catch (err) {
        console.error("LIFF エラー:", err);
        document.body.innerHTML = `
          <div style="text-align:center; padding:20px;">
            <p style="color:#d93025; font-weight:bold; margin-bottom:8px;">エラーが発生しました</p>
            <p style="font-size:12px; color:#888;">LINEアプリ内から再度開き直してください。</p>
          </div>
        `;
      }
    }

    redirectGoogleForm();
  </script>
</body>
</html>
